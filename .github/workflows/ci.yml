name: Continuous Integration - Medical AI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Detiene la ejecución si hay errores de sintaxis o variables no definidas
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning si viola complejidad ciclomática o formato PEP 8
          flake8 src tests --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Execute Automated Test Suite (Pytest)
        run: |
          python -m pytest tests -v --tb=short

